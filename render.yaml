services:
  - type: web
    name: estoque-seu-raimundo
    env: python
    buildCommand: "pip install -r requirements.txt && cd backend && python manage.py migrate && python manage.py loaddata dados_iniciais.json && python manage.py collectstatic --noinput"
    startCommand: "cd backend && gunicorn config.wsgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
